<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ws://127.0.0.1:* ws://localhost:*; media-src 'self' blob:; object-src 'none'; base-uri 'none'" />
    <title>Peek</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="overlay" aria-label="Peek assistant">
      <header class="header">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span><h1>Peek</h1><span id="interaction" class="interaction">穿透</span></div>
        <div class="header-actions"><button id="language-toggle" class="language-toggle" type="button" aria-label="Switch language">中 / EN</button><button id="audio-toggle" class="audio-toggle" type="button" aria-pressed="false"><span class="status-dot"></span><span id="audio-label">开启音频</span></button></div>
      </header>

      <div id="shortcut-warning" class="notice" role="status" hidden></div>
      <div id="notice" class="notice" role="status" hidden></div>

      <div class="context-toolbar"><button id="prepare-toggle" class="text-button" type="button" aria-expanded="false" aria-controls="prepare-panel">准备</button><span id="focused-title">未选文章</span></div>
      <section id="prepare-panel" class="prepare-panel" aria-label="Prepare presentation" hidden>
        <select id="model" aria-label="模型 / Model"><option value="gpt-6.1-sol">GPT-6.1 Sol</option><option value="gpt-6-astra">GPT-6 Astra</option></select>
        <div class="library-actions"><span id="library-count">Markdown / TXT</span><button id="choose-library" class="text-button" type="button">打开文库</button><button id="reload-library" class="text-button" type="button" disabled>刷新</button></div>
        <select id="section" aria-label="搜索范围"><option value="">全部文库</option></select>
        <select id="focus-article" aria-label="当前文章"><option value="">选择当前文章</option></select>
        <button id="prepare-done" class="secondary-button" type="button">开始</button>
      </section>

      <section id="response-area" class="response-area" aria-label="Answer">
        <div id="capture-warning" class="notice" role="status" hidden></div>
        <div id="empty-state" class="empty-state">
          <h2 id="empty-title">随时提问。</h2>
          <button id="connect-key" class="primary-button connect-key" type="button" hidden>连接 OpenAI</button>
          <div id="ask-key-hint" class="empty-key"><kbd id="ask-key">Control Enter</kbd></div>
        </div>
        <div id="answer" class="answer" role="log" aria-live="polite" aria-relevant="additions text"></div>
        <details id="sources-panel" class="sources-panel" hidden><summary id="sources-label">关联</summary><div id="sources"></div></details>
      </section>

      <section class="voice-controls" aria-label="Answer from speech">
        <div id="request-state" class="request-state" role="status"></div>
        <div class="composer-actions"><button id="new-topic" class="secondary-button" type="button">新话题</button><button id="cancel" class="text-button" type="button" hidden>停止</button><button id="ask" class="primary-button voice-answer" type="button">回答</button></div>
      </section>

      <footer class="footer"><span id="hold-hint">按住 Shift 操作</span><button id="manage-key" class="footer-key" type="button">密钥</button><details id="audio-details" class="audio-details"><summary id="audio-state">音频关闭</summary><div class="diagnostics"><strong id="audio-input-label">音频输入</strong><p id="audio-message"></p><div id="devices">开启音频后显示设备。</div></div></details></footer>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
